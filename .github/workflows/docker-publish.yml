name: build, test, publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# packages:write is what lets the publish job push to GHCR using the built-in
# GITHUB_TOKEN — no extra secret needed for that registry.
permissions:
  contents: read
  packages: write

jobs:
  # ── Nothing private may ever reach this repository ──────────────────────
  # A pushed commit is public and permanent — deleting the file later does not
  # remove it from history. This runs before anything else so a commit carrying
  # someone's books or credentials fails immediately rather than after a build.
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No database, receipt or credential may be tracked
        run: |
          set -e
          # Checks what git actually TRACKS, not what is on disk — .gitignore is
          # only a suggestion until something is committed, and an already-tracked
          # file keeps being committed no matter what .gitignore says.
          bad=$(git ls-files | grep -iE \
            '(^|/)data/|\.(db|db-wal|db-shm|sqlite3?|dump)$|(^|/)\.env$|(^|/)\.env\.(?!example)|\.pem$|\.key$|(^|/)id_(rsa|ed25519)$|pg-export.*\.json$|backup.*\.sql$' \
            | grep -vE '^server/migrations/.*\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: these must never be committed:"; echo "$bad"; exit 1
          fi
          echo "no data or credential files are tracked"

      - name: The same must be true of every commit in history
        run: |
          set -e
          bad=$(git log --all --pretty=format: --name-only --diff-filter=A \
            | sort -u | grep -iE \
            '(^|/)data/|\.(db|db-wal|db-shm|sqlite3?|dump)$|(^|/)\.env$|\.pem$|\.key$|(^|/)id_(rsa|ed25519)$|pg-export.*\.json$|backup.*\.sql$' \
            | grep -vE '^server/migrations/.*\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: these appear somewhere in git history:"; echo "$bad"
            echo "History must be rewritten — deleting them in a new commit is not enough."
            exit 1
          fi
          echo "git history is clean"

  # The unit suite covers the parts where a silent wrong answer is worst: the
  # money split and the calendar classifier.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Types must compile
        run: npm run build

      # The published image is multi-arch, but the lockfile is written on x64.
      # `npm install` on an x64 machine can prune the optional native bindings
      # for every other platform out of the lockfile, and nothing notices until
      # the arm64 leg of the release build dies with no bundler binary — after
      # the tag is cut and every test has passed.
      #
      # Regenerate in place (`npm install --package-lock-only` with the existing
      # lockfile present) rather than deleting it first, which is what prunes.
      - name: Lockfile must still carry arm64 binaries
        run: |
          python3 - <<'PY'
          import json, sys
          lock = json.load(open('package-lock.json'))
          # The runtime is Alpine on arm64, so musl arm64 is the combination that
          # has to be resolvable. A pruned lockfile keeps a stray arm64 entry or
          # two but drops every musl one, so this is the check that actually
          # discriminates.
          musl = sorted(k.split('/')[-1] for k in lock['packages'] if 'linux-arm64-musl' in k)
          if not musl:
              print('FAIL: the lockfile has no linux-arm64-musl native packages.')
              print('It was regenerated from scratch on x64, which prunes other')
              print('platforms — the arm64 image would build with no native binaries.')
              print('Fix: git checkout <last good> -- package-lock.json '
                    '&& npm install --package-lock-only   (in place, do not delete it first)')
              sys.exit(1)
          print(f'arm64 musl binaries present: {", ".join(musl)}')
          PY

  # Builds the image and exercises it the way a new self-hoster would: empty
  # database, no pre-seeded state, no host files. This is the check that catches
  # "works on my machine" regressions before they reach anyone.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t teamledger:ci .

      - name: Start the app on an empty volume, with no configuration at all
        run: |
          # Deliberately no SESSION_SECRET and no .env: the entire promise of the
          # single-container port is that `docker compose up -d` with nothing
          # else is a working install. If this step ever needs a variable added
          # to make it boot, that promise has been broken.
          docker volume create tl-data
          docker run -d --name tl-app -v tl-data:/app/data -p 3212:3212 \
            -e NODE_ENV=development \
            -e APP_URL=http://localhost:3212 -e ICAL_SYNC_INTERVAL_MINUTES=0 \
            teamledger:ci
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3212/api/health; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container did not come up"; docker logs tl-app; exit 1

      - name: A fresh install must present the setup screen
        run: |
          set -e
          curl -fsS http://localhost:3212/api/setup/status | grep -q '"configured":false'
          echo "fresh install reports unconfigured"

      - name: First-run flow, and setup must be claimable only once
        run: |
          set -e
          B=http://localhost:3212/api
          curl -fsS -c /tmp/j -X POST "$B/setup" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' | grep -q '"ok":true'

          # A second setup call must be refused, or anyone could claim an
          # already-configured instance.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/setup" \
            -H 'Content-Type: application/json' \
            -d '{"email":"attacker@example.com","password":"another-password"}')
          [ "$code" = "400" ] || { echo "FAIL: setup was claimable twice (got $code)"; exit 1; }

          # Wrong password must be rejected, and logout must invalidate.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/auth/login" \
            -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"nope"}')
          [ "$code" = "401" ] || { echo "FAIL: bad password accepted (got $code)"; exit 1; }

          curl -fsS -b /tmp/j -c /tmp/j -X POST "$B/auth/logout" >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/j "$B/teams")
          [ "$code" = "401" ] || { echo "FAIL: session survived logout (got $code)"; exit 1; }
          echo "first-run flow OK"

      - name: Unauthenticated requests must not reach data
        run: |
          set -e
          for path in teams seasons; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3212/api/$path")
            [ "$code" = "401" ] || { echo "FAIL: /api/$path returned $code without a session"; exit 1; }
          done
          echo "API is closed without a session"

      - name: The money math must survive a real round trip
        run: |
          set -e
          B=http://localhost:3212/api
          curl -fsS -c /tmp/j -X POST "$B/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' >/dev/null
          post() { curl -fsS -b /tmp/j -X POST "$B$1" -H 'Content-Type: application/json' -d "$2"; }
          T=$(post /teams '{"name":"CI FC"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          S=$(post /seasons "{\"teamId\":$T,\"term\":\"spring\",\"year\":2026,\"firstPaymentCents\":15000}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 15); do post /seasons/$S/roster "{\"name\":\"P$i\"}" >/dev/null; done
          post /seasons/$S/expenses '{"category":"misc","label":"Season costs","amountCents":407500}' >/dev/null

          # 15 players, $4,075.00. Exact shares must sum to the total even though
          # it does not divide evenly — the quoted figure rounds up to $271.67.
          curl -fsS -b /tmp/j "$B/seasons/$S/budget" > /tmp/budget.json
          python3 - <<'PY'
          import json
          b = json.load(open('/tmp/budget.json'))
          assert b['totalExpensesCents'] == 407500, b['totalExpensesCents']
          assert b['quotedPerPlayerCents'] == 27167, b['quotedPerPlayerCents']
          shares = sum(p['shareCents'] for p in b['playerBalances'])
          assert shares == b['netDueCents'], f"shares {shares} != net {b['netDueCents']}"
          p = b['playerBalances'][0]
          assert p['firstPaymentDueCents'] == 15000
          assert p['finalPaymentDueCents'] == p['duesCents'] - 15000
          print("budget math OK:", b['quotedPerPlayerCents'], "per player, shares sum exactly")
          PY

      # Every screen in the app is one of these reads. The Bank screen once
      # shipped entirely broken -- a Postgres `::int` cast that SQLite cannot
      # parse -- and the suite stayed green because it only ever asked for
      # /teams, /budget and the exports. A 500 on any of these is a page the
      # treasurer cannot open, so all of them get requested.
      - name: Every read endpoint must answer
        run: |
          set -e
          B=http://localhost:3212/api
          fail=0
          check() {
            code=$(curl -s -o /tmp/resp -w '%{http_code}' -b /tmp/j "$B$1")
            if [ "$code" != "200" ]; then
              echo "  FAIL $1 -> $code: $(head -c 200 /tmp/resp)"; fail=1
            else
              echo "  ok   $1"
            fi
          }
          check /auth/me
          check /teams
          check /seasons
          check /teams/1/bank
          check /teams/1/bank/export.csv
          check /teams/1/trainers
          check /teams/1/untransferred
          check /seasons/1/budget
          check /seasons/1/roster
          check /seasons/1/events
          check /seasons/1/payments
          check /seasons/1/cost-rules
          check /seasons/1/feeds
          check /seasons/1/tournaments
          check /seasons/1/trainer-ledger
          [ "$fail" = "0" ] || { echo "one or more screens would be broken"; exit 1; }
          echo "every read endpoint answers 200"

      - name: Exports must generate
        run: |
          set -e
          B=http://localhost:3212/api
          S=1
          for kind in roster ledger budget balances; do
            curl -fsS -b /tmp/j "$B/seasons/$S/export/$kind.csv" -o /tmp/$kind.csv
            # Excel needs the UTF-8 BOM or it mangles accented names. Compared as
            # hex because grep on raw bytes is locale-dependent and gives a false
            # failure on a file that is actually correct.
            bom=$(head -c 3 /tmp/$kind.csv | od -An -tx1 | tr -d ' \n')
            [ "$bom" = "efbbbf" ] || { echo "FAIL: $kind.csv missing BOM (got $bom)"; exit 1; }
          done
          for doc in budget budget-sheet; do
            curl -fsS -b /tmp/j "$B/seasons/$S/export/$doc.pdf" -o /tmp/$doc.pdf
            head -c 4 /tmp/$doc.pdf | grep -q '%PDF' || { echo "FAIL: $doc.pdf is not a PDF"; exit 1; }
          done
          echo "exports OK"

      - name: Home-screen assets must be served
        run: |
          set -e
          for a in apple-touch-icon.png manifest.webmanifest favicon.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3212/$a")
            [ "$code" = "200" ] || { echo "FAIL: /$a returned $code"; exit 1; }
          done
          echo "PWA assets OK"

      # Every screen except the dashboard is a client-side route, so if the
      # catch-all stops handing back index.html the whole app 404s on refresh
      # and on any shared link — while /api and the static files above keep
      # answering perfectly, which is what makes it easy to miss.
      #
      # It is a regex route (`/^(?!\/api).*/`), the exact construct that
      # path-to-regexp rewrites have broken before, so it is worth a test of its
      # own rather than being assumed from a green build.
      - name: Client-side routes must fall back to index.html
        run: |
          set -e
          for p in /budget /roster /schedule /bank /exports /settings /roster/1; do
            code=$(curl -s -o /tmp/spa -w '%{http_code}' "http://localhost:3212$p")
            [ "$code" = "200" ] || { echo "FAIL: $p returned $code"; exit 1; }
            grep -qi '<!doctype html>' /tmp/spa || { echo "FAIL: $p did not return the app shell"; exit 1; }
          done
          # And the negative case: an unknown /api path must still 404 as JSON
          # rather than being swallowed by the catch-all and answered with HTML.
          code=$(curl -s -o /tmp/na -w '%{http_code}' http://localhost:3212/api/definitely-not-a-route)
          grep -qi '<!doctype html>' /tmp/na && { echo "FAIL: /api/* fell through to the app shell"; exit 1; }
          echo "client-side routing OK (api still returns $code, not HTML)"

      # Everything above this point can pass while every screen is blank white.
      # A dependency bump once left two copies of React in the tree; it threw on
      # mount, rendered nothing, and the server stayed perfectly healthy — right
      # money, right routes, right HTML, empty page. Only a browser can tell the
      # difference, so one runs here.
      - name: The app must actually render, not just return HTML
        run: |
          set -e
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          node scripts/check-render.mjs http://localhost:3212

      - name: A generated session secret must persist across a restart
        run: |
          set -e
          # This container was started with no SESSION_SECRET, so one was
          # generated on first boot and stored in the database. It has to be the
          # SAME secret after a restart — if it were regenerated, every restart
          # would silently sign out the treasurer and every parent.
          docker exec tl-app node --input-type=commonjs -e "
            const D = require('better-sqlite3');
            const db = new D('/app/data/teamledger.db', { readonly: true });
            const row = db.prepare(\"select value from app_settings where key = 'session_secret'\").get();
            if (!row || row.value.length < 32) { console.error('no secret stored'); process.exit(1); }
            console.log(row.value);
          " > /tmp/secret-before
          docker restart tl-app >/dev/null
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://localhost:3212/api/health && break; sleep 1; done
          docker exec tl-app node --input-type=commonjs -e "
            const D = require('better-sqlite3');
            const db = new D('/app/data/teamledger.db', { readonly: true });
            console.log(db.prepare(\"select value from app_settings where key = 'session_secret'\").get().value);
          " > /tmp/secret-after
          cmp -s /tmp/secret-before /tmp/secret-after \
            || { echo "FAIL: session secret changed across a restart"; exit 1; }
          # And the session issued before the restart must still be good.
          curl -fsS -b /tmp/j http://localhost:3212/api/teams >/dev/null \
            || { echo "FAIL: existing session broke across a restart"; exit 1; }
          echo "generated secret is stable across restarts"

      - name: The nightly backup must produce a readable snapshot
        run: |
          set -e
          # The scheduler fires at 03:00, so drive the same function directly.
          # dist/ is ESM, hence --input-type=module.
          docker exec tl-app node --input-type=module -e "
            const { runBackup } = await import('/app/dist/services/backup.js');
            if (!runBackup()) { console.error('backup returned null'); process.exit(1); }
          "
          # It has to be a restorable database, not a zero-byte file: being
          # restorable is the only reason it exists.
          docker exec tl-app node --input-type=commonjs -e "
            const fs = require('fs'), D = require('better-sqlite3');
            const dir = '/app/data/backups';
            const f = fs.readdirSync(dir).filter(x => x.endsWith('.db')).sort().pop();
            if (!f) { console.error('no backup file on disk'); process.exit(1); }
            const db = new D(dir + '/' + f, { readonly: true });
            const ok = db.pragma('integrity_check')[0].integrity_check;
            const n = db.prepare('select count(*) c from admin_users').get().c;
            if (ok !== 'ok' || n !== 1) { console.error('bad snapshot', ok, n); process.exit(1); }
            console.log('snapshot', f, '| integrity', ok, '| admins', n);
          "

      - name: A correct password must never be rate limited
        run: |
          set -e
          B=http://localhost:3212/api
          # The limiter counts FAILED attempts only. Counting successes meant the
          # tenth correct login in a window was refused, and with TRUST_PROXY off
          # every client shares one bucket — so signing in from two devices could
          # lock the treasurer out of their own instance with the right password.
          # Runs before the spoofing test below, which deliberately exhausts the
          # bucket.
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/auth/login" \
              -H 'Content-Type: application/json' \
              -d '{"email":"ci@example.com","password":"ci-password-123"}')
            [ "$code" = "200" ] || { echo "FAIL: successful login #$i returned $code"; exit 1; }
          done
          echo "15 consecutive valid logins all accepted"

      - name: Login rate limit must not be bypassable via X-Forwarded-For
        run: |
          set -e
          B=http://localhost:3212/api
          # TRUST_PROXY is unset here, so forged X-Forwarded-For values must NOT
          # create separate rate-limit buckets. Regression test for the class of
          # bug where trusting that header unconditionally gives unlimited
          # password guesses.
          seen429=0
          for i in $(seq 1 16); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/auth/login" \
              -H "X-Forwarded-For: 10.9.$i.$i" \
              -H 'Content-Type: application/json' \
              -d '{"email":"ci@example.com","password":"wrong"}')
            [ "$code" = "429" ] && seen429=1
          done
          [ "$seen429" = "1" ] || { echo "FAIL: rate limit bypassed by spoofed X-Forwarded-For"; exit 1; }
          echo "rate limit holds against spoofing"

      - name: Cascade deletes must actually cascade
        run: |
          set -e
          # Foreign keys are OFF by default in SQLite, and the schema is full of
          # onDelete: 'cascade' that would then silently do nothing — deleting a
          # season would leave its expenses behind as orphans that still count
          # toward somebody's budget. The pragma is set per connection, so this
          # verifies the running app, not just the schema.
          docker exec tl-app node --input-type=commonjs -e "
            const D = require('better-sqlite3');
            const db = new D('/app/data/teamledger.db');
            db.pragma('foreign_keys = ON');
            const fk = db.pragma('foreign_keys')[0].foreign_keys;
            if (!fk) { console.error('foreign_keys off'); process.exit(1); }
            // A throwaway team of its own, so this proves the cascade without
            // disturbing the fixtures the later steps assert on.
            const t = db.prepare(\"insert into teams (name) values ('cascade probe') returning id\").get();
            const s = db.prepare(\"insert into seasons (team_id, term, year) values (?, 'fall', 2099) returning id\").get(t.id);
            db.prepare(\"insert into expenses (season_id, category, label, amount_cents) values (?, 'misc', 'cascade probe', 100)\").run(s.id);
            db.prepare('delete from teams where id = ?').run(t.id);
            const left = db.prepare('select count(*) c from expenses where season_id = ?').get(s.id).c;
            const seasons = db.prepare('select count(*) c from seasons where id = ?').get(s.id).c;
            if (left !== 0 || seasons !== 0) { console.error('orphans left behind:', { left, seasons }); process.exit(1); }
            console.log('cascade removed dependent rows two levels down');
          "

      - name: A newer database must refuse to boot on an older binary
        run: |
          set -e
          # Simulate a rollback: stamp the schema version past what this build
          # understands, then confirm the container refuses to start rather than
          # writing into a schema it does not know.
          docker exec tl-app node --input-type=commonjs -e "
            const D = require('better-sqlite3');
            new D('/app/data/teamledger.db').prepare('update app_schema_version set version = 9999 where id = 1').run();
          "
          if docker run --rm -v tl-data:/app/data \
            -e APP_URL=http://localhost:3212 \
            --name tl-downgrade teamledger:ci > /tmp/downgrade.log 2>&1; then
            echo "FAIL: started against a newer database"; cat /tmp/downgrade.log; exit 1
          fi
          grep -q "REFUSING TO START" /tmp/downgrade.log \
            || { echo "FAIL: no downgrade warning"; cat /tmp/downgrade.log; exit 1; }
          docker exec tl-app node --input-type=commonjs -e "
            const D = require('better-sqlite3');
            new D('/app/data/teamledger.db').prepare('update app_schema_version set version = 1 where id = 1').run();
          "
          echo "downgrade guard works"

      - name: Bind-mounted upload directory must be writable
        run: |
          set -e
          # RUN chown in the Dockerfile is masked by a host bind mount — Docker
          # creates the missing host directory as root. The entrypoint has to fix
          # ownership at runtime or uploads fail for every user with a bind mount.
          mkdir -p /tmp/bindtest
          docker run --rm -v /tmp/bindtest:/app/data \
            --entrypoint /usr/local/bin/docker-entrypoint.sh teamledger:ci \
            sh -c 'touch /app/data/receipts/probe && touch /app/data/teamledger.db' \
            || { echo "FAIL: app cannot write to a bind-mounted data directory"; exit 1; }
          echo "bind-mounted volume is writable"

      - name: App must run as a non-root user
        run: |
          # /proc/1 rather than `id`: the entrypoint starts as root to chown the
          # volume and drops privileges with su-exec, so `docker exec id` reports
          # the image default and would pass even if the drop had regressed.
          u=$(docker exec tl-app sh -c 'stat -c %U /proc/1')
          [ "$u" != "root" ] || { echo "FAIL: app process runs as root"; exit 1; }
          echo "app process runs as: $u"

      - name: Runtime image must not ship a build toolchain
        run: |
          for b in gcc g++ make python3; do
            if docker exec tl-app sh -c "command -v $b" >/dev/null 2>&1; then
              echo "FAIL: $b present in the runtime image"; exit 1
            fi
          done
          echo "runtime image is clean"
          docker image inspect teamledger:ci --format 'image size: {{.Size}} bytes'

      # ── The image must never carry anyone's books ────────────────────────
      # This is the gate that has to hold. A published image is world-readable
      # forever, so a database, a receipt or a .env that slips into the build
      # context cannot be walked back by deleting the tag. .dockerignore is what
      # prevents it; this proves .dockerignore actually worked, on the real
      # artifact, every build — rather than trusting that nobody edited it.
      #
      # Checked against a FRESHLY BUILT image, not the running container, since
      # the running one has a data volume attached by design.
      - name: PUBLISHED IMAGE MUST CONTAIN NO DATA
        run: |
          set -e
          probe() { docker run --rm --entrypoint sh teamledger:ci -c "$1"; }

          # 1. The data directory ships empty. Anything else means a real
          #    install's database or receipts were copied in at build time.
          leaked=$(probe 'find /app/data -type f 2>/dev/null | head -20')
          if [ -n "$leaked" ]; then
            echo "FAIL: image ships files under /app/data:"; echo "$leaked"; exit 1
          fi

          # 2. No database, dump or export anywhere in the image. node_modules
          #    is excluded because better-sqlite3 legitimately vendors test
          #    fixtures and prebuilt binaries.
          leaked=$(probe 'find / -not -path "*/node_modules/*" -not -path "/proc/*" -not -path "/sys/*" \
            \( -name "*.db" -o -name "*.db-wal" -o -name "*.sqlite" -o -name "*.sqlite3" \
               -o -name "*.dump" -o -name "pg-export*.json" -o -name "*backup*.sql" \) 2>/dev/null | head -20')
          if [ -n "$leaked" ]; then
            echo "FAIL: image ships a database or dump:"; echo "$leaked"; exit 1
          fi

          # 3. No real .env. Only migrations/*.sql (schema DDL) is allowed SQL.
          leaked=$(probe 'find / -not -path "*/node_modules/*" -not -path "/proc/*" \
            \( -name ".env" -o -name ".env.*" \) 2>/dev/null | head -20')
          if [ -n "$leaked" ]; then
            echo "FAIL: image ships an environment file:"; echo "$leaked"; exit 1
          fi

          # 4. The git history must not be in there either — it would carry
          #    every file ever committed, including any later deleted.
          if probe '[ -e /app/.git ] || [ -e /.git ]'; then
            echo "FAIL: image ships a .git directory"; exit 1
          fi

          echo "image carries no database, no receipts, no .env, no git history"

      - name: Docker healthcheck must report healthy
        run: |
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' tl-app 2>/dev/null || echo none)
            [ "$s" = "healthy" ] && { echo "healthy after ${i}s"; exit 0; }
            [ "$s" = "unhealthy" ] && { echo "FAIL: unhealthy"; docker logs tl-app; exit 1; }
            sleep 1
          done
          echo "FAIL: never became healthy (last status: $s)"; docker logs tl-app; exit 1

      - name: Data must survive a container recreate, and migrations must re-run clean
        run: |
          set -e
          docker rm -f tl-app >/dev/null
          docker run -d --name tl-app2 -v tl-data:/app/data -p 3212:3212 \
            -e NODE_ENV=development \
            -e APP_URL=http://localhost:3212 -e ICAL_SYNC_INTERVAL_MINUTES=0 \
            teamledger:ci
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://localhost:3212/api/health && break; sleep 1; done

          # Already set up, so the app must NOT offer the setup screen again.
          curl -fsS http://localhost:3212/api/setup/status | grep -q '"configured":true' \
            || { echo "FAIL: data did not persist"; exit 1; }
          curl -fsS -c /tmp/j2 -X POST http://localhost:3212/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' | grep -q '"ok":true'
          curl -fsS -b /tmp/j2 http://localhost:3212/api/teams | grep -q 'CI FC'
          echo "persistence OK"

      - name: Container logs (always)
        if: always()
        run: docker logs tl-app2 2>&1 || docker logs tl-app 2>&1 || true

  # Only fires on a v* tag, and only after both test jobs pass. arm64 matters
  # because plenty of self-hosters run this on a Pi or a NAS.
  publish:
    needs: [unit, container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR as well as Docker Hub: Docker Hub rate-limits anonymous pulls, which
      # is a real problem for self-hosters who redeploy often. Same image, two
      # places, no extra credentials.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 produces :1.2.3, :1.2, :1 and :latest, so users can pin as tightly
      # or as loosely as they like. Also emits the OCI labels linking the image
      # back to this repo.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/teamledger
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keeps the Docker Hub overview in step with a release, so the page people
      # land on is never describing an older version. It syncs a page written
      # for Docker Hub rather than the README, because the README's screenshots
      # are repo-relative paths that would render as broken images there.
      #
      # Never allowed to fail a release: the images are already pushed by this
      # point, and a stale description is not worth failing a build over. If it
      # reports a failure, Docker Hub's description API can be fussy about
      # tokens — a password secret may be needed instead of the PAT.
      - name: Sync the Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # Docker Hub's description API rejects the ordinary push token with
          # 403 Forbidden. It needs either an account password or a PAT scoped
          # for it, so DOCKERHUB_PASSWORD is preferred when present.
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/teamledger
          short-description: "Self-hosted treasury for a youth sports team. Prices your iCal schedule into a budget."
          readme-filepath: ./docs/dockerhub.md
