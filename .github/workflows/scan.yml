# Scans the image people are actually running, which is a different question
# from the one dependabot answers. Dependabot watches manifests in this repo: it
# tells you a dependency has a fix available. This tells you a CVE was disclosed
# against the published artifact — including everything in the base image that
# no manifest here mentions.
#
# Weekly rather than per-build on purpose. A CVE is disclosed on the world's
# schedule, not on ours: the image that was clean when it was tagged is the one
# self-hosters keep running for months, and nothing in a build pipeline would
# ever look at it again.
#
# Two images are scanned, because a red run means different things for each:
# findings in the published image that main has already fixed mean "cut a
# release"; findings in main too mean "something needs fixing". The summary
# says which.

name: Vulnerability scan

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  # Also immediately after a release, so a newly published image is scanned
  # against today's CVE feed rather than sitting unexamined for up to a week.
  # Without this the two halves are unrelated: the scan reports on whatever
  # :latest happened to be, and a release that fixed a finding leaves Monday
  # red until Monday comes round.
  #
  # workflow_run rather than `push: tags`, which would race: the tag fires both
  # workflows at once and the scan would read the *previous* :latest, reporting
  # on the image the release is in the middle of replacing.
  workflow_run:
    workflows: ['build, test, publish']
    types: [completed]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # includes building the image from main
    # The publish workflow also runs on every push to main, where it builds and
    # tests but publishes nothing. Scanning then would re-report an unchanged
    # image on every commit, which is the noise this workflow exists to avoid —
    # so only a successful *tag* run counts. head_branch is the tag name for a
    # tag-triggered run.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      # A workflow_run or schedule trigger checks out the default branch, so
      # this is main whichever way the scan was started.
      - uses: actions/checkout@v7

      - name: Build image from main
        run: docker build -t teamledger:main .

      - name: Scan the published image
        id: published
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: raymondoooo/teamledger:latest
          severity: HIGH,CRITICAL
          # The flag that decides whether this is worth having. Without it the
          # run goes red for CVEs that have no patch yet — nothing anyone can
          # act on, every Monday, until the failure means nothing and a real
          # finding scrolls past with the rest. Fail only on what can be fixed.
          ignore-unfixed: true
          exit-code: '1'
          output: published.txt

      - name: Scan main
        id: main
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: teamledger:main
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          output: main.txt
          skip-setup-trivy: true

      - name: Summary
        env:
          PUBLISHED: ${{ steps.published.outcome }}
          MAIN: ${{ steps.main.outcome }}
        run: |
          if [ "$MAIN" != success ]; then
            verdict="**Needs a fix.** main has findings, so a release alone won't clear them."
          elif [ "$PUBLISHED" != success ]; then
            verdict="**Needs a release.** The published image has findings that main has already fixed."
          else
            verdict="Clean. Neither image has fixable HIGH or CRITICAL findings."
          fi
          {
            echo "## $verdict"
            echo
            echo "| Image | Fixable HIGH/CRITICAL |"
            echo "|---|---|"
            echo "| \`raymondoooo/teamledger:latest\` | $([ "$PUBLISHED" = success ] && echo none || echo found) |"
            echo "| main | $([ "$MAIN" = success ] && echo none || echo found) |"
            for f in published main; do
              if [ -s "$f.txt" ]; then
                echo; echo "<details><summary>$f</summary>"; echo; echo '```'; cat "$f.txt"; echo '```'; echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict"
          [ "$PUBLISHED" = success ] && [ "$MAIN" = success ]
